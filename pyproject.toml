[build-system]
requries = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "qrlab"
version = "1.0.0"
description = "PyBullet-based framework for Reinforcement Learning quadrotor control"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

dependencies = [
    "numpy>=2.2,<3",
    "scipy>=1.5,<2",
    "pybullet==3.2.7",
    "gymnasium>=1.3,<2",
    "stable-baselines3>=2.9,<3",
    "torch>=2.3",
    "pillow>=11,<13",
    "matplotlib>=3.10,<4",
    "cycler>=0.12,<1"
]

[project.optional-dependencies]
optimization = [
    "optuna>=4,<5"
]

analysis = [
    "pandas>=2.2,<4",
    "rich>=13",
    "textual>=0.80",
    "aquarel",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "environments",
    "environments.*",
    "helpers",
    "python_scripts",
]

[tool.setuptools.package-data]
environments = [
    "assets/*.urdf",
    "assets/*.dae"
]